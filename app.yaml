apiVersion: apps/v1
kind: Deployment
metadata:
  name: newapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newapp
  template:
    metadata:
      labels:
        app: newapp
    spec:
      containers:
        - name: app
          image: ishaq0925/k8s_app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CONTAINER_NAME
              value: app
---
apiVersion: v1
kind: Service
metadata:
  name: newapp
spec:
  type: NodePort
  selector:
    app: newapp
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
